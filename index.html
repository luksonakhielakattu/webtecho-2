<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bike Showroom Booking Form</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
}
.container{
    width:450px;
    margin:30px auto;
    background:white;
    padding:20px;
    border:1px solid #ccc;
}
h2{
    text-align:center;
    color:darkblue;
}
label{
    font-weight:bold;
}
input,select,textarea{
    width:100%;
    padding:8px;
    margin-top:5px;
    margin-bottom:12px;
    box-sizing:border-box;
}
input[type="radio"],
input[type="checkbox"]{
    width:auto;
    margin-right:5px;
}
input[type="submit"],
input[type="reset"]{
    width:48%;
    padding:10px;
}
</style>

</head>

<body>

<div class="container">

<h2>Bike Showroom Booking Form</h2>

<form>

<label for="name">Customer Name</label>
<input type="text"
id="name"
placeholder="Enter your name"
pattern="[A-Za-z ]+"
required>

<label for="email">Email</label>
<input type="email"
id="email"
placeholder="example@gmail.com"
required>

<label for="phone">Phone Number</label>
<input type="tel"
id="phone"
placeholder="Enter phone number"
pattern="[0-9]{10}"
required>

<label for="age">Age</label>
<input type="number"
id="age"
min="18"
max="70"
required>

<label for="visit">Preferred Visit Date</label>
<input type="date"
id="visit"
required>

<label>Gender</label><br>

<input type="radio" name="gender" value="Male"> Male
<input type="radio" name="gender" value="Female"> Female

<br><br>

<label>Bike Brand</label><br>

<input type="checkbox" name="brand" value="Yamaha"> Yamaha
<input type="checkbox" name="brand" value="Honda"> Honda
<input type="checkbox" name="brand" value="Royal Enfield"> Royal Enfield

<br><br>

<label>Bike Model</label>

<select required>
<option value="">Select Bike Model</option>
<option>Sport Bike</option>
<option>Cruiser</option>
<option>Adventure Bike</option>
<option>Scooter</option>
</select>

<label>Address</label>

<textarea rows="4"
placeholder="Enter your address"
required></textarea>

<label>Preferred Bike Color</label>
<input type="color">

<label>Upload Driving License</label>
<input type="file">

<label>Budget Range</label>
<input type="range"
min="50000"
max="500000">

<br><br>

<input type="submit" value="Book Now">
<input type="reset" value="Reset">

</form>

</div>

</body>
</html>
